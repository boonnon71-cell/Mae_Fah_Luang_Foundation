<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสต๊อกสินค้า - โครงการพัฒนาดอยตุง</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        
         :root {
            --gold: #B8960C;
            --gold-light: #D4AF37;
            --gold-dark: #8B6914;
            --cream: #FAF7F0;
            --dark: #1a1a1a;
            --text: #2c2c2c;
            --muted: #6b6b6b;
            --border: #e8e0d0;
            --white: #ffffff;
            --green: #2d7a4f;
            --red: #a32d2d;
            --blue: #185FA5;
            --bg: #f5f0e8;
        }
        
        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 15px
        }
        /* LOGIN PAGE */
        
        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: url('k.jpg') center center / cover no-repeat;
            position: relative;
            overflow: hidden;
        }
        
        #loginPage::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 1;
        }
        
        .loginCard {
            background: var(--white);
            border-radius: 16px;
            padding: 48px 40px;
            width: 420px;
            position: relative;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        }
        
        .logoWrap {
            text-align: center;
            margin-bottom: 32px
        }
        
        .logoAnim {
            animation: logoPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both
        }
        
        @keyframes logoPopIn {
            from {
                transform: scale(0) rotate(-10deg);
                opacity: 0
            }
            to {
                transform: scale(1) rotate(0);
                opacity: 1
            }
        }
        
        .logoImg {
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
            display: block;
            object-fit: contain;
            border-radius: 50%;
        }
        
        .topbarLogo {
            width: 36px;
            height: 36px;
            display: block;
            object-fit: contain;
            border-radius: 50%;
        }
        
        .logoTitle {
            font-size: 14px;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.4
        }
        
        .loginTitle {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px
        }
        
        .loginSub {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 28px
        }
        
        .formGroup {
            margin-bottom: 16px
        }
        
        .formGroup label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px
        }
        
        .formGroup input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            background: var(--cream);
        }
        
        .formGroup input:focus {
            border-color: var(--gold)
        }
        
        .loginBtn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
            margin-top: 8px;
        }
        
        .loginBtn:hover {
            background: var(--gold-dark)
        }
        
        .loginBtn:active {
            transform: scale(0.98)
        }
        
        .loginErr {
            background: #fee;
            border: 1px solid #fcc;
            color: var(--red);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        /* MAIN APP */
        
        #mainApp {
            display: none;
            min-height: 100vh;
            flex-direction: column
        }
        /* TOPBAR */
        
        .topbar {
            background: var(--dark);
            color: var(--white);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--gold);
        }
        
        .topbarLeft {
            display: flex;
            align-items: center;
            gap: 12px
        }
        
        .topbarTitle {
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
            line-height: 1.2
        }
        
        .topbarTitle span {
            display: block;
            font-size: 11px;
            color: #aaa;
            font-weight: 400
        }
        
        .topbarRight {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative
        }
        
        .locSwitchTop {
            display: flex;
            gap: 2px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 3px;
        }
        
        .locSwitchTop button {
            border: none;
            background: none;
            color: #bbb;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        
        .locSwitchTop button.active {
            background: var(--gold);
            color: var(--dark);
        }
        
        .userBtn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(184, 150, 12, 0.15);
            border: 1px solid var(--gold-dark);
            border-radius: 24px;
            padding: 6px 14px 6px 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .userBtn:hover {
            background: rgba(184, 150, 12, 0.25)
        }
        
        .userAvatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--dark);
            overflow: hidden;
        }
        
        .userAvatar img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }
        
        .userName {
            font-size: 13px;
            color: var(--white);
            font-weight: 600
        }
        
        .userDropdown {
            position: absolute;
            right: 0;
            top: 50px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            min-width: 220px;
            overflow: hidden;
            display: none;
            z-index: 200;
        }
        
        .userDropdown.open {
            display: block;
            animation: fadeDown 0.2s ease
        }
        
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-8px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        
        .dropHeader {
            padding: 16px;
            background: var(--cream);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px
        }
        
        .dropAvatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--dark);
            overflow: hidden
        }
        
        .dropAvatar img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }
        
        .dropName {
            font-weight: 700;
            font-size: 14px;
            color: var(--dark)
        }
        
        .dropRole {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px
        }
        
        .dropLogout {
            display: block;
            width: 100%;
            padding: 12px 16px;
            text-align: left;
            background: none;
            border: none;
            color: var(--red);
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        
        .dropLogout:hover {
            background: #fee
        }
        /* TOP NAV (was sidebar) */
        
        .topNav {
            background: var(--dark);
            border-bottom: 1px solid #333;
            padding: 8px 24px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            position: sticky;
            top: 60px;
            z-index: 90;
            overflow-x: auto;
        }
        
        .navItem {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: none;
            border-radius: 8px;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .navItem:hover {
            background: rgba(184, 150, 12, 0.1);
            color: var(--gold)
        }
        
        .navItem.active {
            background: rgba(184, 150, 12, 0.2);
            color: var(--gold)
        }
        
        .navItem svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0
        }
        /* LAYOUT */
        
        .content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: var(--bg)
        }
        
        .pageTitle {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px
        }
        
        .pageSub {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px
        }
        /* CARDS */
        
        .card {
            background: var(--white);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 16px
        }
        
        .cardTitle {
            font-size: 15px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border)
        }
        /* STATS */
        
        .statsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px
        }
        
        .statCard {
            background: var(--white);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            text-align: center
        }
        
        .statNum {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold)
        }
        
        .statLabel {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px
        }
        /* TABLE */
        
        .tableWrap {
            overflow-x: auto
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }
        
        th {
            background: var(--cream);
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid var(--border)
        }
        
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text)
        }
        
        tr:hover td {
            background: #faf8f2
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700
        }
        
        .badge-in {
            background: #e8f5ee;
            color: var(--green)
        }
        
        .badge-out {
            background: #fee;
            color: var(--red)
        }
        
        .badge-pending {
            background: #fff3cd;
            color: #856404
        }
        
        .badge-approved {
            background: #e8f5ee;
            color: var(--green)
        }
        
        .badge-rejected {
            background: #fee;
            color: var(--red)
        }
        
        .badge-low {
            background: #fee3cd;
            color: #8b4513
        }
        
        .badge-loc {
            background: #eef2fb;
            color: var(--blue)
        }
        /* BTNS */
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.15s
        }
        
        .btn-primary {
            background: var(--gold);
            color: var(--white)
        }
        
        .btn-primary:hover {
            background: var(--gold-dark)
        }
        
        .btn-danger {
            background: var(--red);
            color: var(--white)
        }
        
        .btn-danger:hover {
            background: #7a1f1f
        }
        
        .btn-outline {
            background: none;
            border: 1.5px solid var(--border);
            color: var(--text)
        }
        
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold)
        }
        
        .btn-success {
            background: var(--green);
            color: var(--white)
        }
        
        .btn-success:hover {
            background: #1f5a37
        }
        
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px
        }
        /* FORM */
        
        .formRow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px
        }
        
        .formRow.one {
            grid-template-columns: 1fr
        }
        
        .fLabel {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 4px
        }
        
        .fInput {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            background: var(--cream);
        }
        
        .fInput:focus {
            border-color: var(--gold)
        }
        
        .fSelect {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            background: var(--cream);
            cursor: pointer
        }
        
        .fSelect:focus {
            border-color: var(--gold)
        }
        
        textarea.fInput {
            resize: vertical;
            min-height: 80px
        }
        /* MODAL */
        
        .modalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modalOverlay.open {
            display: flex;
            animation: fadeIn 0.2s ease
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0
            }
            to {
                opacity: 1
            }
        }
        
        .modal {
            background: var(--white);
            border-radius: 16px;
            padding: 28px;
            width: 500px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.25s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0
            }
            to {
                transform: translateY(0);
                opacity: 1
            }
        }
        
        .modalTitle {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border)
        }
        
        .modalActions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border)
        }
        /* FILTER BAR */
        
        .filterBar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center
        }
        
        .filterBar .fInput {
            width: auto;
            flex: 1;
            min-width: 150px
        }
        /* LOW STOCK ALERT */
        
        .alertBox {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #856404;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* EMPTY STATE */
        
        .emptyState {
            text-align: center;
            padding: 48px;
            color: var(--muted)
        }
        
        @media(max-width:640px) {
            .formRow {
                grid-template-columns: 1fr
            }
            .locSwitchTop {
                display: none
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="loginCard">
            <div class="logoWrap">
                <div class="logoAnim">
                    <img class="logoImg" src="logo.png" alt="โลโก้มูลนิธิแม่ฟ้าหลวง" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <svg style="display:none" class="logoImg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="48" fill="#1a1a1a" stroke="#B8960C" stroke-width="3"/>
                        <circle cx="50" cy="50" r="35" fill="none" stroke="#B8960C" stroke-width="1.5" stroke-dasharray="4,3"/>
                        <g transform="translate(50,50)">
                            <line x1="0" y1="-30" x2="0" y2="-15" stroke="#B8960C" stroke-width="2.5" stroke-linecap="round"/>
                            <line x1="0" y1="-30" x2="-10" y2="-20" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
                            <line x1="0" y1="-30" x2="10" y2="-20" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
                            <line x1="-26" y1="15" x2="-13" y2="7" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
                            <line x1="-26" y1="15" x2="-23" y2="3" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
                            <line x1="26" y1="15" x2="13" y2="7" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
                            <line x1="26" y1="15" x2="23" y2="3" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
                            <polygon points="0,-15 13,7 -13,7" fill="#B8960C" opacity="0.9"/>
                            <circle cx="0" cy="0" r="5" fill="#D4AF37"/>
                            <circle cx="0" cy="0" r="2.5" fill="#1a1a1a"/>
                        </g>
                        <text x="50" y="85" text-anchor="middle" fill="#D4AF37" font-size="6" font-family="Arial" letter-spacing="0.5">มูลนิธิแม่ฟ้าหลวง</text>
                    </svg>
                </div>
                <div class="logoTitle">มูลนิธิแม่ฟ้าหลวง ในพระบรมราชูปถัมภ์<br><small style="font-size:11px;color:#aaa">Mae Fah Luang Foundation</small></div>
            </div>

            <div class="loginErr" id="loginErr">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
            <div class="formGroup">
                <label>ชื่อผู้ใช้งาน</label>
                <input type="text" id="loginUser" placeholder="กรอกรหัสพนักงาน" autocomplete="off">
            </div>
            <div class="formGroup">
                <label>รหัสผ่าน</label>
                <input type="password" id="loginPass" placeholder="กรอกรหัสผ่าน">
            </div>
            <button class="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" style="display:none;flex-direction:column">
        <div class="topbar">
            <div class="topbarLeft">
                <img class="topbarLogo" src="logo.png" alt="โลโก้" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <svg style="display:none" class="topbarLogo" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="19" fill="#1a1a1a" stroke="#B8960C" stroke-width="1.5"/>
                    <g transform="translate(20,20)">
                        <line x1="0" y1="-12" x2="0" y2="-6" stroke="#B8960C" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="0" y1="-12" x2="-4" y2="-8" stroke="#B8960C" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="0" y1="-12" x2="4" y2="-8" stroke="#B8960C" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="-10" y1="6" x2="-5" y2="3" stroke="#B8960C" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="10" y1="6" x2="5" y2="3" stroke="#B8960C" stroke-width="1.5" stroke-linecap="round"/>
                        <polygon points="0,-6 5,3 -5,3" fill="#B8960C"/>
                        <circle cx="0" cy="0" r="2.5" fill="#D4AF37"/>
                    </g>
                </svg>
                <div class="topbarTitle">ระบบสต๊อกสินค้า<span>โครงการพัฒนาดอยตุง</span></div>
            </div>
            <div class="topbarRight">
                <div class="locSwitchTop" id="locSwitchTop"></div>
                <div class="userBtn" onclick="toggleDropdown()">
                    <div class="userAvatar" id="topAvatar">ส</div>
                    <div class="userName" id="topName">-</div>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
                <div class="userDropdown" id="userDropdown">
                    <div class="dropHeader">
                        <div class="dropAvatar" id="dropAvatar">ส</div>
                        <div>
                            <div class="dropName" id="dropName">-</div>
                            <div class="dropRole" id="dropRole">-</div>
                        </div>
                    </div>

        // หมวดหมู่สินค้า (รหัสนำหน้า -> ชื่อหมวดหมู่) ขยายเพิ่มได้ในอนาคต
        const DEFAULT_CATEGORIES = {

        let products = [];
        let transactions = [];
        let requests = [];
        let purchaseOrders = [];
        let refCounters = {
            O: 0,
            P: 0
        }; // ตัวนับรหัสอ้างอิง คำขอเบิก(O) / ใบสั่งสินค้า(P)
        let poCounters = {}; // ตัวนับรหัสใบสั่งสินค้า (A001...) แยกตามสถานที่

        function loadData() {
            try {
                const p = localStorage.getItem('doitung_products');

                if (r) requests = JSON.parse(r);
                const po = localStorage.getItem('doitung_purchaseOrders');
                if (po) purchaseOrders = JSON.parse(po);
                const c = localStorage.getItem('doitung_categories');
                if (c) CATEGORIES = JSON.parse(c);
                const rc = localStorage.getItem('doitung_refCounters');
                if (rc) refCounters = JSON.parse(rc);

                if (pc) poCounters = JSON.parse(pc);
            } catch (e) {}
            if (!Object.keys(CATEGORIES).length) {
                CATEGORIES = {...DEFAULT_CATEGORIES

                products = [{
                    id: 'P001',

                    minStock: 10
                }, {
                    id: 'P002',
                    name: 'ผักสลัด',

                    location: 'ห้องอาหาร',

                    minStock: 5
                }, {
                    id: 'P003',
                    name: 'ผักบุ้ง',
                    unit: 'กก.',
                    location: 'ห้องอาหาร',
                    stock: 8,
                    minStock: 10
                }, {
                    id: 'P004',
                    name: 'สลัดกรีนโอ๊ค',
                    unit: 'กก.',
                    location: 'ห้องอาหาร',
                    stock: 20,
                    minStock: 5
                }, {
                    id: 'B001',
                    name: 'น้ำมันพืช',
                    unit: 'ลิตร',
                    location: 'ห้องอาหาร',
                    stock: 15,
                    minStock: 5
                }, {
                    id: 'D001',
                    name: 'กาแฟคั่วบด',
                    unit: 'กก.',
                    location: 'มุมสบาย',

        function saveCategories() {

        function saveRefCounters() {
            localStorage.setItem('doitung_refCounters', JSON.stringify(refCounters));
        }

        function savePoCounters() {
            localStorage.setItem('doitung_poCounters', JSON.stringify(poCounters));
        }

        // แยกรหัสสินค้าออกเป็น {prefix, num} เช่น 'P012' -> {prefix:'P', num:12}
        function parseProductId(id) {
            const m = /^([A-Z]+)(\d+)$/.exec(id || '');
            return m ? {
                prefix: m[1],
                num: parseInt(m[2], 10)
            } : null;
        }

        // สร้างรหัสสินค้าถัดไปในหมวดหมู่ที่กำหนด เช่น เลือกหมวด P -> คืนค่า 'P005'
        function genProductId(prefix) {
            let max = 0;
            products.forEach(p => {
                const parsed = parseProductId(p.id);
                if (parsed && parsed.prefix === prefix) max = Math.max(max, parsed.num);
            });
            return prefix + String(max + 1).padStart(3, '0');
        }

        // สร้างรหัสอ้างอิงไม่ซ้ำกัน เช่น #00001-O-01WEQ (typeChar: 'O'=คำขอเบิก, 'P'=ใบสั่งสินค้า)
        function genRefCode(typeChar, locCode) {
            refCounters[typeChar] = (refCounters[typeChar] || 0) + 1;
            saveRefCounters();
            const seq = String(refCounters[typeChar]).padStart(5, '0');
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let rand = '';
            for (let i = 0; i < 3; i++) rand += letters[Math.floor(Math.random() * letters.length)];
            return `#${seq}-${typeChar}-${locCode || '00'}${rand}`;
        }

        // สร้างรหัสใบสั่งสินค้า A001, A002... แยกรันตามสถานที่
        function genPoCode(location) {
            poCounters[location] = (poCounters[location] || 0) + 1;
            savePoCounters();
            return 'A' + String(poCounters[location]).padStart(3, '0');
        }

        function saveProducts() {
            localStorage.setItem('doitung_products', JSON.stringify(products));
        }

        function saveTransactions() {
            localStorage.setItem('doitung_transactions', JSON.stringify(transactions));
        }

        function saveRequests() {
            localStorage.setItem('doitung_requests', JSON.stringify(requests));
        }

        function savePurchaseOrders() {
            localStorage.setItem('doitung_purchaseOrders', JSON.stringify(purchaseOrders));
        }

        function doLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const user = USERS[u];
            if (user && p === u) {
                currentUser = user;
                document.getElementById('loginErr').style.display = 'none';
                startApp();
            } else {
                document.getElementById('loginErr').style.display = 'block';
            }
        }
        document.getElementById('loginPass').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('loginUser').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });

            currentUser = null;
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';

            document.getElementById('loginPass').value = '';
        }

        function toggleDropdown() {
            document.getElementById('userDropdown').classList.toggle('open');
        }

            if (!e.target.closest('.topbarRight'))
                document.getElementById('userDropdown').classList.remove('open');
        });

        function startApp() {

            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            const initials = currentUser.name.charAt(0);
            document.getElementById('topAvatar').textContent = initials;
            document.getElementById('topName').textContent = currentUser.name.split(' ')[0];
            document.getElementById('dropAvatar').textContent = initials;

            document.getElementById('dropRole').textContent = currentUser.position;

            showPage(currentUser.role === 'admin' ? 'dashboard' : 'myRequest');
        }

        function buildLocSwitchTop() {
            const el = document.getElementById('locSwitchTop');
            el.innerHTML = LOCATIONS.map(l => `<button class="${l===currentLocation?'active':''}" onclick="setLocation('${l}')">📍 ${l}</button>`).join('');

            currentLocation = loc;
            buildLocSwitchTop();
            showPage(currentPage);

        function buildTopNav() {

                </button>
                <button class="navItem" onclick="showPage('products')" id="nav-products">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>จัดการสินค้า
                </button>
                <button class="navItem" onclick="showPage('stock')" id="nav-stock">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>ตรวจสอบสต๊อก
                </button>
                <button class="navItem" onclick="showPage('stockIn')" id="nav-stockIn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>สินค้าเข้า
                </button>
                <button class="navItem" onclick="showPage('stockOut')" id="nav-stockOut">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="8 8 12 12 16 8"/><line x1="12" y1="3" x2="12" y2="12"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>สินค้าออก
                </button>
                <button class="navItem" onclick="showPage('history')" id="nav-history">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>ประวัติการเคลื่อนไหว
                </button>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    คำขอเบิกสินค้า
                    <span id="pendingBadge" style="display:none;background:var(--red);color:white;border-radius:12px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:2px"></span>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6l6 6v12a2 2 0 01-2 2H9a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>

                <button class="navItem" onclick="showPage('myHistory')" id="nav-myHistory">

                </button>

                </button>`;
            }
        }

        function locationSwitcher() {
            return `<div class="filterBar">
                <span style="font-size:12px;color:var(--muted);font-weight:600;margin-right:4px">📍 ดูสต๊อกของ:</span>
                ${LOCATIONS.map(l=>`<button class="btn ${l===currentLocation?'btn-primary':'btn-outline'} btn-sm" onclick="setLocation('${l}')">${l}</button>`).join('')}
            </div>`;
        }

        function showPage(page) {
            currentPage = page;
            document.querySelectorAll('.navItem').forEach(el => el.classList.remove('active'));
            const nav = document.getElementById('nav-' + page);
            if (nav) nav.classList.add('active');
            const content = document.getElementById('pageContent');
            switch (page) {
                case 'dashboard':
                    renderDashboard(content);
                    break;
                case 'products':
                    renderProducts(content);
                    break;
                case 'stock':
                    renderStock(content);
                    break;
                case 'stockIn':
                    renderStockIn(content);
                    break;
                case 'stockOut':
                    renderStockOut(content);
                    break;
                case 'history':
                    renderHistory(content);
                    break;
                case 'requests':
                    renderRequests(content);
                    break;
                case 'purchaseOrder':
                    renderPurchaseOrder(content);
                    break;
                case 'myRequest':
                    renderMyRequest(content);
                    break;
                case 'myHistory':
                    renderMyHistory(content);
                    break;
                case 'viewStock':
                    renderViewStock(content);
                    break;
            }
            updatePendingBadge();
        }

        function updatePendingBadge() {
            const badge = document.getElementById('pendingBadge');
            if (!badge) return;
            const count = requests.filter(r => r.status === 'pending').length;
            badge.style.display = count > 0 ? 'inline' : 'none';
            badge.textContent = count;
        }

        function productsAt(loc) {
            return products.filter(p => p.location === loc);
        }

        function renderDashboard(el) {
            const scoped = productsAt(currentLocation);
            const totalProducts = scoped.length;
            const totalStock = scoped.reduce((s, p) => s + p.stock, 0);
            const lowStock = scoped.filter(p => p.stock <= p.minStock).length;
            const pendingReq = requests.filter(r => r.status === 'pending').length;
            const today = new Date().toDateString();
            const scopedIds = scoped.map(p => p.id);
            const todayIn = transactions.filter(t => t.type === 'IN' && scopedIds.includes(t.productId) && new Date(t.dateTime).toDateString() === today).reduce((s, t) => s + t.qty, 0);
            const todayOut = transactions.filter(t => t.type === 'OUT' && scopedIds.includes(t.productId) && new Date(t.dateTime).toDateString() === today).reduce((s, t) => s + t.qty, 0);
            const lowItems = scoped.filter(p => p.stock <= p.minStock).map(p => `<b>${p.name}</b> (${p.stock} ${p.unit})`).join(', ');
            el.innerHTML = `
            <div class="pageTitle">ภาพรวมระบบ</div>
            <div class="pageSub">สรุปข้อมูลสต๊อกสินค้าประจำวัน — สถานที่: <b>${currentLocation}</b></div>
            ${locationSwitcher()}
            ${lowStock>0?`<div class="alertBox">⚠️ สินค้าใกล้หมด: ${lowItems}</div>`:''}
            <div class="statsGrid">
                <div class="statCard"><div class="statNum">${totalProducts}</div><div class="statLabel">รายการสินค้า</div></div>
                <div class="statCard"><div class="statNum">${totalStock}</div><div class="statLabel">สต๊อกรวม</div></div>
                <div class="statCard"><div class="statNum" style="color:var(--green)">${todayIn}</div><div class="statLabel">เข้าวันนี้</div></div>
                <div class="statCard"><div class="statNum" style="color:var(--red)">${todayOut}</div><div class="statLabel">ออกวันนี้</div></div>
                <div class="statCard"><div class="statNum" style="color:${lowStock>0?'var(--red)':'var(--green)'}">${lowStock}</div><div class="statLabel">สินค้าใกล้หมด</div></div>
                <div class="statCard"><div class="statNum" style="color:${pendingReq>0?'#856404':'var(--muted)'}">${pendingReq}</div><div class="statLabel">รอการอนุมัติ (ทุกสถานที่)</div></div>
            </div>
            <div class="card">
                <div class="cardTitle">สต๊อกสินค้าปัจจุบัน — ${currentLocation}</div>
                <div class="tableWrap"><table>
                    <thead><tr><th>รหัส</th><th>สินค้า</th><th>หน่วย</th><th>คงเหลือ</th><th>สถานะ</th></tr></thead>
                    <tbody>${scoped.length?scoped.map(p=>`
                        <tr>
                            <td style="color:var(--muted);font-size:12px"><b>${p.id}</b></td>
                            <td>${p.name}</td><td>${p.unit}</td><td><b>${p.stock}</b></td>
                            <td>${p.stock<=p.minStock?'<span class="badge badge-low">⚠ ใกล้หมด</span>':'<span class="badge badge-approved">✓ ปกติ</span>'}</td>
                        </tr>`).join(''):'<tr><td colspan="5"><div class="emptyState">ยังไม่มีสินค้าในสถานที่นี้</div></td></tr>'}
                    </tbody>
                </table></div>
            </div>`;
        }

        function renderProducts(el) {
            el.innerHTML = `
            <div class="pageTitle">จัดการสินค้า</div>
            <div class="pageSub">เพิ่ม แก้ไข หรือลบรายการสินค้า — สถานที่: <b>${currentLocation}</b></div>
            ${locationSwitcher()}

                <button class="btn btn-primary" onclick="openAddProduct()">+ เพิ่มสินค้า</button>
                <button class="btn btn-outline" onclick="openAddCategory()">+ เพิ่มหมวดหมู่</button>
            </div>
            <div class="card">
                <div class="tableWrap"><table>
                    <thead><tr><th>รหัส</th><th>หมวดหมู่</th><th>ชื่อสินค้า</th><th>สถานที่</th><th>หน่วย</th><th>สต๊อก</th><th>สต๊อกขั้นต่ำ</th><th>จัดการ</th></tr></thead>
                    <tbody id="productTable">${renderProductRows()}</tbody>
                </table></div>
            </div>`;
        }

        function categoryNameOf(id) {
            const parsed = parseProductId(id);
            return parsed && CATEGORIES[parsed.prefix] ? CATEGORIES[parsed.prefix] : '-';
        }

        function renderProductRows() {
            const scoped = productsAt(currentLocation);
            if (!scoped.length) return '<tr><td colspan="8"><div class="emptyState">ยังไม่มีสินค้าในสถานที่นี้</div></td></tr>';
            return scoped.map(p=>`
                <tr>
                    <td style="color:var(--muted);font-size:12px"><b>${p.id}</b></td>
                    <td style="font-size:12px">${categoryNameOf(p.id)}</td>
                    <td><b>${p.name}</b></td>
                    <td><span class="badge badge-loc">${p.location}</span></td>
                    <td>${p.unit}</td><td><b>${p.stock}</b></td><td>${p.minStock}</td>
                    <td>
                        <button class="btn btn-outline btn-sm" onclick="openEditProduct('${p.id}')">แก้ไข</button>
                        <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="deleteProduct('${p.id}')">ลบ</button>
                    </td>
                </tr>`).join('');
        }

        function openAddCategory() {
            openModal('เพิ่มหมวดหมู่สินค้าใหม่', `
                <div class="formRow">
                    <div><label class="fLabel">รหัสนำหน้า (ตัวอักษร A-Z)</label><input class="fInput" id="catPrefix" placeholder="เช่น F" maxlength="2" style="text-transform:uppercase"></div>
                    <div><label class="fLabel">ชื่อหมวดหมู่</label><input class="fInput" id="catName" placeholder="เช่น เครื่องปรุง"></div>

        function submitStockOut() {
            const pid         = document.getElementById('outProduct').value;
            const qty         = parseInt(document.getElementById('outQty').value)||0;
            const unit        = document.getElementById('outUnit').value;

        function renderHistoryTable(list) {
            const sorted = [...list].sort((a,b)=>new Date(b.dateTime)-new Date(a.dateTime));
            if (!sorted.length) return '<div class="emptyState">ไม่พบข้อมูล</div>';

                <tbody>${sorted.map(t=>{
                    const p=products.find(x=>x.id===t.productId);
                    return `<tr>
                        <td>${t.type==='IN'?'<span class="badge badge-in">▲ เข้า</span>':'<span class="badge badge-out">▼ ออก</span>'}</td>
                        <td style="color:var(--muted);font-size:12px"><b>${t.productId}</b></td>
                        <td style="color:var(--muted);font-size:12px"><b>${t.itemCode||'-'}</b></td>
                        <td>${p?p.name:t.productId}</td>
                        <td>${p?`<span class="badge badge-loc">${p.location}</span>`:'-'}</td>

                        <td>${t.destination||'-'}</td>
                        <td>${fmtDT(t.dateTime)}</td>
                        <td>${t.recorder}</td>
                        <td style="font-size:12px;color:var(--muted)">${t.note||'-'}</td>
                    </tr>`;
                }).join('')}</tbody></table></div>`;
        }

        function filterHistory() {
            const from = document.getElementById('filterFrom').value;
            const to   = document.getElementById('filterTo').value;
            const type = document.getElementById('filterType').value;
            const loc  = document.getElementById('filterLoc').value;
            let filtered = transactions;
            if (from) filtered = filtered.filter(t=>t.dateTime>=from);
            if (to)   filtered = filtered.filter(t=>t.dateTime<=to+'T23:59');
            if (type) filtered = filtered.filter(t=>t.type===type);
            if (loc)  filtered = filtered.filter(t=>{ const p=products.find(x=>x.id===t.productId); return p && p.location===loc; });
            document.getElementById('historyResult').innerHTML = renderHistoryTable(filtered);
        }

        function clearHistoryFilter() {
            document.getElementById('filterFrom').value = '';
            document.getElementById('filterTo').value   = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterLoc').value  = '';
            document.getElementById('historyResult').innerHTML = renderHistoryTable(transactions);

        function filterRequests() {
            const filter = document.getElementById('reqFilter').value;

                        <div>
                            <b style="font-size:15px">${r.requester}</b>

                            </div>
                        </div>
                        ${r.status==='pending'?`<div style="display:flex;gap:6px">
                            <button class="btn btn-success btn-sm" onclick="approveRequest('${r.id}')">✓ อนุมัติ</button>
                            <button class="btn btn-danger btn-sm"  onclick="rejectRequest('${r.id}')">✗ ปฏิเสธ</button>
                        </div>`:''}
                    </div>
                    <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">
                        <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">รายการสินค้า:</div>
                        ${r.items.map(item=>{
                            const p=products.find(x=>x.id===item.productId);
                            const code = item.productId+'-'+(DEST_CODES[r.destination]||'00');
                            return `<span style="display:inline-block;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:3px 10px;margin:2px;font-size:13px">
                                <b style="color:var(--muted);font-size:11px">${code}</b> ${p?p.name:item.productId} × ${item.qty} ${p?p.unit:''} ${p?`<span style="color:var(--muted)">(${p.location})</span>`:''}
                            </span>`;
                        }).join('')}
                    </div>
                </div>`).join('');
        }

        function approveRequest(id) {
            const r = requests.find(x=>x.id===id); if (!r) return;
            const errors = [];
            for (const item of r.items) {
                const p = products.find(x=>x.id===item.productId);
                if (!p || (p.stock - item.qty) < 0) errors.push(`${p?p.name:item.productId} ไม่พอ (มี ${p?p.stock:0})`);
            }
            if (errors.length){ alert('ไม่สามารถอนุมัติได้:\n'+errors.join('\n')); return; }
            for (const item of r.items) {
                const p = products.find(x=>x.id===item.productId);
                p.stock -= item.qty;
                const itemCode = `${p.id}-${DEST_CODES[r.destination]||'00'}`;
                transactions.push({
                    id:'T'+Date.now()+Math.random(), productId:item.productId, type:'OUT',
                    qty:item.qty, unit:p.unit, destination:r.destination||(r.groupName?r.groupName:(r.purpose||'-')),
                    itemCode, refCode:r.refCode, dateTime:new Date().toISOString(),
                    recorder:currentUser.name, note:`อนุมัติเบิก: ${r.requester} | ${r.purpose}`
                });
            }
            r.status='approved'; r.approvedAt=new Date().toISOString(); r.approvedBy=currentUser.name;
            saveProducts(); saveTransactions(); saveRequests();
            showPage('requests');
        }

        function rejectRequest(id) {
            const r=requests.find(x=>x.id===id); if (!r) return;
            r.status='rejected'; r.rejectedAt=new Date().toISOString(); r.rejectedBy=currentUser.name;
            saveRequests(); showPage('requests');
        }

        function renderViewStock(el) {
            const scoped = productsAt(currentLocation);
            el.innerHTML = `
            <div class="pageTitle">ดูสต๊อกสินค้า</div>
            <div class="pageSub">ตรวจสอบจำนวนสินค้าคงเหลือ — สถานที่: <b>${currentLocation}</b></div>
            ${locationSwitcher()}
            <div class="card">
                <div class="tableWrap"><table>
                    <thead><tr><th>รหัส</th><th>สินค้า</th><th>หน่วย</th><th>คงเหลือ</th><th>สถานะ</th></tr></thead>
                    <tbody>${scoped.length?scoped.map(p=>`
                        <tr>
                            <td style="color:var(--muted);font-size:12px"><b>${p.id}</b></td>
                            <td><b>${p.name}</b></td><td>${p.unit}</td>
                            <td><span style="font-size:17px;font-weight:700;color:${p.stock<=p.minStock?'var(--red)':'var(--green)'}">${p.stock}</span></td>
                            <td>${p.stock<=0?'<span class="badge badge-rejected">หมด</span>':p.stock<=p.minStock?'<span class="badge badge-low">⚠ น้อย</span>':'<span class="badge badge-approved">✓ มีพอ</span>'}</td>
                        </tr>`).join(''):'<tr><td colspan="5"><div class="emptyState">ยังไม่มีสินค้าในสถานที่นี้</div></td></tr>'}
                    </tbody>
                </table></div>
            </div>`;
        }

        let reqItems = [];
        function renderMyRequest(el) {
            reqItems = [{productId:'',qty:1}];
            el.innerHTML = `
            <div class="pageTitle">ขอเบิกสินค้า</div>
            <div class="pageSub">กรอกรายการสินค้าที่ต้องการเบิก — สถานที่: <b>${currentLocation}</b></div>
            ${locationSwitcher()}
            <div class="card">
                <div class="cardTitle">รายการสินค้าที่ต้องการเบิก</div>
                <div id="reqItemsContainer">${renderReqItems()}</div>
                <button class="btn btn-outline" onclick="addReqItem()" style="margin-bottom:16px">+ เพิ่มสินค้า</button>
                <div class="formRow one">
                    <div><label class="fLabel">วัตถุประสงค์ / ใช้ทำอะไร</label>
                        <textarea class="fInput" id="reqPurpose" placeholder="เช่น ใช้ปรุงอาหารกลางวัน รับรองคณะผู้เยี่ยมชม..."></textarea>
                    </div>
                </div>
                <div class="formRow one">
                    <div><label class="fLabel">เบิกไปที่ (ปลายทาง)</label>
                        <select class="fSelect" id="reqDestination">${DESTINATIONS.map(d=>`<option ${d===currentLocation?'selected':''}>${d}</option>`).join('')}</select>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;padding:8px 0;margin-bottom:8px">
                    <input type="checkbox" id="hasGroup" onchange="toggleGroup()" style="width:16px;height:16px;cursor:pointer">
                    <label for="hasGroup" style="font-size:14px;cursor:pointer">มีคณะ/ทัวร์เข้า</label>
                </div>
                <div id="groupFields" style="display:none">
                    <div class="formRow">
                        <div><label class="fLabel">ชื่อคณะ/ทัวร์</label><input class="fInput" id="groupName" placeholder="ชื่อคณะ..."></div>
                        <div><label class="fLabel">เลขทัวร์</label><input class="fInput" id="tourNum" placeholder="T-0001"></div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="submitRequest()" style="margin-top:8px">📤 ส่งคำขอเบิกสินค้า</button>
            </div>`;
        }

        function toggleGroup() {
            document.getElementById('groupFields').style.display = document.getElementById('hasGroup').checked ? 'block' : 'none';
        }

        function renderReqItems() {
            const scoped = productsAt(currentLocation);
            return reqItems.map((item,i)=>`
                <div style="display:flex;gap:8px;margin-bottom:8px;align-items:flex-end">
                    <div style="flex:2"><label class="fLabel">สินค้า</label>
                        <select class="fSelect" onchange="reqItems[${i}].productId=this.value">
                            <option value="">-- เลือกสินค้า --</option>
                            ${scoped.map(p=>`<option value="${p.id}" ${item.productId===p.id?'selected':''}>${p.id} - ${p.name} (คงเหลือ: ${p.stock} ${p.unit})</option>`).join('')}
                        </select>
                    </div>
                    <div style="flex:1"><label class="fLabel">จำนวน</label>
                        <input class="fInput" type="number" min="0.1" step="0.1" value="${item.qty}" onchange="reqItems[${i}].qty=parseFloat(this.value)||1">
                    </div>
                    ${reqItems.length>1?`<button class="btn btn-danger btn-sm" style="margin-bottom:1px" onclick="removeReqItem(${i})">✕</button>`:''}
                </div>`).join('');
        }

        function addReqItem() {
            reqItems.push({productId:'',qty:1});
            document.getElementById('reqItemsContainer').innerHTML = renderReqItems();
        }

        function removeReqItem(i) {
            reqItems.splice(i,1);
            document.getElementById('reqItemsContainer').innerHTML = renderReqItems();
        }

        function submitRequest() {
            const validItems = reqItems.filter(x=>x.productId&&x.qty>0);
            if (!validItems.length){ alert('กรุณาเลือกสินค้าอย่างน้อย 1 รายการ'); return; }
            for (const item of validItems) {
                const p = products.find(x=>x.id===item.productId);
                if (p && (p.stock - item.qty) < 0){
                    alert(`${p.name} มีไม่พอสำหรับคำขอนี้ (คงเหลือ ${p.stock} ${p.unit})`);
                    return;
                }
            }
            const purpose  = document.getElementById('reqPurpose').value.trim();
            if (!purpose){ alert('กรุณากรอกวัตถุประสงค์'); return; }
            const destination = document.getElementById('reqDestination').value;
            const hasGroup = document.getElementById('hasGroup').checked;
            const groupName= hasGroup ? document.getElementById('groupName').value.trim() : '';
            const tourNum  = hasGroup ? document.getElementById('tourNum').value.trim()   : '';
            const refCode = genRefCode('O', DEST_CODES[destination]);
            const req = {
                id:'REQ'+Date.now(), refCode, requester:currentUser.name, requesterId:currentUser.id,
                items:validItems, purpose, destination,
                groupName: groupName+(tourNum?'('+tourNum+')':''),
                status:'pending', createdAt:new Date().toISOString()
            };
            requests.push(req);
            saveRequests();
            alert(`✓ ส่งคำขอเบิกสินค้าเรียบร้อยแล้ว รหัสอ้างอิง: ${refCode}\nรอการอนุมัติจากผู้ดูแลระบบ`);
            showPage('myHistory');
        }

        function renderMyHistory(el) {
            const myReqs = [...requests].filter(r=>r.requesterId===currentUser.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
            el.innerHTML = `
            <div class="pageTitle">ประวัติการเบิก</div>
            <div class="pageSub">รายการคำขอเบิกสินค้าของคุณ</div>
            ${!myReqs.length?'<div class="card"><div class="emptyState">ยังไม่มีประวัติการเบิก</div></div>':
            myReqs.map(r=>`
                <div class="card" style="border-left:4px solid ${r.status==='pending'?'#ffc107':r.status==='approved'?'var(--green)':'var(--red)'}">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                        <span class="badge ${r.status==='pending'?'badge-pending':r.status==='approved'?'badge-approved':'badge-rejected'}">
                            ${r.status==='pending'?'รอดำเนินการ':r.status==='approved'?'✓ อนุมัติแล้ว':'✗ ไม่อนุมัติ'}
                        </span>
                        <span style="font-size:11px;color:var(--muted)">${r.refCode||''}</span>
                        <span style="font-size:12px;color:var(--muted)">${fmtDT(r.createdAt)} | ${r.purpose} ${r.destination?'| ไปที่: '+r.destination:''} ${r.groupName?'| คณะ: '+r.groupName:''}</span>
                    </div>
                    <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
                        ${r.items.map(item=>{
                            const p=products.find(x=>x.id===item.productId);
                            const code = item.productId+'-'+(DEST_CODES[r.destination]||'00');
                            return `<span style="display:inline-block;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:3px 10px;margin:2px;font-size:13px"><b style="color:var(--muted);font-size:11px">${code}</b> ${p?p.name:item.productId} × ${item.qty} ${p?p.unit:''}</span>`;
                        }).join('')}
                    </div>
                </div>`).join('')}`;
        }

        // ===== ใบสั่งสินค้า (Purchase Order) — เฉพาะหัวหน้าแผนก/แอดมิน =====
        let poItems = [];
        function renderPurchaseOrder(el) {
            poItems = [{name:'',qty:1,unit:UNITS[0]}];
            el.innerHTML = `
            <div class="pageTitle">ใบสั่งสินค้า</div>
            <div class="pageSub">สำหรับหัวหน้างานแต่ละแผนกสั่งซื้อสินค้าเพิ่มเติม (พนักงานทั่วไปไม่มีสิทธิ์ใช้งานหน้านี้) — สถานที่: <b>${currentLocation}</b></div>
            ${locationSwitcher()}
            <div class="card">
                <div class="cardTitle">ข้อมูลผู้ขอสั่งสินค้า</div>
                <div class="formRow">
                    <div><label class="fLabel">ชื่อ-สกุล</label><input class="fInput" value="${currentUser.name}" disabled></div>
                    <div><label class="fLabel">ตำแหน่ง</label><input class="fInput" value="${currentUser.position}" disabled></div>
                </div>
                <div class="formRow one">
                    <div><label class="fLabel">ต้องการให้สั่งของภายในวันที่</label><input class="fInput" type="date" id="poDate"></div>
                </div>
                <div class="cardTitle" style="margin-top:8px">รายการสินค้าที่ต้องการสั่งซื้อ</div>
                <div id="poItemsContainer">${renderPoItems()}</div>
                <button class="btn btn-outline" onclick="addPoItem()" style="margin-bottom:16px">+ เพิ่มรายการ</button>
                <button class="btn btn-primary" onclick="submitPO()">📤 ส่งใบสั่งสินค้า</button>
            </div>
            <div class="card">
                <div class="cardTitle">ประวัติใบสั่งสินค้า</div>
                <div class="tableWrap">${renderPoTable()}</div>
            </div>`;
        }

        function renderPoItems() {
            return poItems.map((it,i)=>`
                <div style="display:flex;gap:8px;margin-bottom:8px;align-items:flex-end">
                    <div style="flex:2"><label class="fLabel">ชื่อสินค้า</label>
                        <input class="fInput" value="${it.name}" placeholder="ชื่อสินค้าที่ต้องการสั่ง" onchange="poItems[${i}].name=this.value">
                    </div>
                    <div style="flex:1"><label class="fLabel">จำนวน</label>
                        <input class="fInput" type="number" min="0.1" step="0.1" value="${it.qty}" onchange="poItems[${i}].qty=parseFloat(this.value)||1">
                    </div>
                    <div style="flex:1"><label class="fLabel">หน่วย</label>
                        <select class="fSelect" onchange="poItems[${i}].unit=this.value">${UNITS.map(u=>`<option ${u===it.unit?'selected':''}>${u}</option>`).join('')}</select>
                    </div>
                    ${poItems.length>1?`<button class="btn btn-danger btn-sm" style="margin-bottom:1px" onclick="removePoItem(${i})">✕</button>`:''}
                </div>`).join('');
        }

        function addPoItem() {
            poItems.push({name:'',qty:1,unit:UNITS[0]});
            document.getElementById('poItemsContainer').innerHTML = renderPoItems();
        }

        function removePoItem(i) {
            poItems.splice(i,1);
            document.getElementById('poItemsContainer').innerHTML = renderPoItems();
        }

        function submitPO() {
            const validItems = poItems.filter(x=>x.name.trim()&&x.qty>0);
            if (!validItems.length){ alert('กรุณากรอกรายการสินค้าอย่างน้อย 1 รายการ'); return; }
            const needDate = document.getElementById('poDate').value;
            if (!needDate){ alert('กรุณาระบุวันที่ต้องการให้สั่งของ'); return; }
            const poCode  = genPoCode(currentLocation);
            const refCode = genRefCode('P', DEST_CODES[currentLocation]);
            purchaseOrders.push({
                id:'PO'+Date.now(), poCode, refCode, requesterId:currentUser.id, requester:currentUser.name,
                position:currentUser.position, location:currentLocation,
                items:validItems, needDate, createdAt:new Date().toISOString()
            });
            savePurchaseOrders();
            alert(`✓ ส่งใบสั่งสินค้าเรียบร้อยแล้ว\nรหัสใบสั่ง: ${poCode}\nรหัสอ้างอิง: ${refCode}`);
            showPage('purchaseOrder');
        }

        function renderPoTable() {
            const sorted = [...purchaseOrders].filter(o=>o.location===currentLocation).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
            if (!sorted.length) return '<div class="emptyState">ยังไม่มีใบสั่งสินค้าในสถานที่นี้</div>';
            return `<table>
                <thead><tr><th>รหัสใบสั่ง</th><th>รหัสอ้างอิง</th><th>ผู้ขอสั่ง</th><th>ตำแหน่ง</th><th>รายการสินค้า</th><th>ต้องการภายในวันที่</th><th>วันที่ส่งคำขอ</th></tr></thead>
                <tbody>${sorted.map(o=>`
                    <tr>
                        <td><b>${o.poCode||'-'}</b></td>
                        <td style="font-size:11px;color:var(--muted)">${o.refCode||'-'}</td>
                        <td>${o.requester}</td><td>${o.position}</td>
                        <td>${o.items.map(it=>`<span style="display:inline-block;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:12px">${it.name} × ${it.qty} ${it.unit}</span>`).join('')}</td>
                        <td>${o.needDate}</td>
                        <td>${fmtDT(o.createdAt)}</td>
                    </tr>`).join('')}</tbody>
            </table>`;
        }

        function openModal(title, body, actions) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML    = body;
            const actEl = document.getElementById('modalActions');
            actEl.innerHTML = '';
            actions.forEach(a=>{
                const b = document.createElement('button');
                b.className = 'btn '+a.cls;
                b.textContent = a.label;
                b.onclick = a.fn;
                actEl.appendChild(b);
            });
            document.getElementById('modal').classList.add('open');
        }
        function closeModal() { document.getElementById('modal').classList.remove('open'); }
        document.getElementById('modal').addEventListener('click', e=>{
            if (e.target===document.getElementById('modal')) closeModal();
        });

        function nowDT() {
            const d=new Date(), pad=n=>String(n).padStart(2,'0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        function fmtDT(dt) {
            if (!dt) return '-';
            const d=new Date(dt);
            return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
        }
    </script>
</body>

</html>
